name: Docs site build

on:
  pull_request:
    paths: ['docs/**', 'docs-site/**', '.github/workflows/docs-site.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'docs-site/**', '.github/workflows/docs-site.yml']

permissions:
  contents: read

concurrency:
  group: docs-site-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
