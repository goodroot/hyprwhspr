name: Website build

on:
  pull_request:
    paths: ['website/**', 'scripts/install.sh', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', 'scripts/install.sh', '.github/workflows/website.yml']

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
