name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # hyprwhspr requires 3.11-3.14 (managed_install.interpreter, install.sh,
        # managed-launcher.sh). Test the floor and the ceiling.
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      # A CI runner has no /usr/lib/hyprwhspr. Re-run pointed at a path that does
      # not exist so a test that silently leans on a real install fails here
      # rather than on a contributor's machine.
      - name: Tests with no host installation
        env:
          HYPRWHSPR_ROOT: /nonexistent
        run: python -m unittest discover -s tests
