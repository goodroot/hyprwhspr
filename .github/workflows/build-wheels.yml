name: Build PyWhisperCPP Wheels

# CUDA and Vulkan wheels; CPU comes from PyPI. Version, build tag, commit, and
# variant suffixes are derived from lib/src/backend_installer.py so the workflow
# never restates the contract. Wheels publish to the rolling `wheels-v2` release
# the installer downloads from (WHEEL_BASE_URL); published wheels are never
# overwritten, a rebuild bumps PYWHISPERCPP_WHEEL_BUILD instead. Pushes to main
# are gated by a preflight that skips each variant whose wheels for the pinned
# version and build are already published, so a version or build bump ships
# wheels automatically and unrelated installer edits cost two curls.

on:
  workflow_dispatch:
    inputs:
      pywhispercpp_commit:
        description: 'PyWhisperCPP commit (empty = backend_installer.PYWHISPERCPP_PINNED_COMMIT)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['lib/src/backend_installer.py']

concurrency:
  group: build-wheels
  cancel-in-progress: false

env:
  CUDA_BUILD_VERSION: '12.6'  # one 12.x build serves all CUDA 12

jobs:
  preflight:
    name: Check wheels-v2 for pinned version
    runs-on: ubuntu-latest
    outputs:
      build_cuda: ${{ steps.gate.outputs.build_cuda }}
      build_vulkan: ${{ steps.gate.outputs.build_vulkan }}
    steps:
      - name: Checkout hyprwhspr
        uses: actions/checkout@v7

      - name: Skip variants whose wheels are already published
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_cuda=true" >> "$GITHUB_OUTPUT"
            echo "build_vulkan=true" >> "$GITHUB_OUTPUT"
            echo "manual run: building all variants"
            exit 0
          fi
          vulkan=$(PYTHONPATH=lib/src python3 -c "import backend_installer as b; print(b.VULKAN_WHEEL_VARIANT)")
          for pair in "cuda:cuda12" "vulkan:${vulkan}"; do
            key="${pair%%:*}"
            variant="${pair#*:}"
            probe=$(PYTHONPATH=lib/src python3 -c "import backend_installer as b; print(b._get_wheel_filename('3.14', '${variant}', True))")
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/wheels-v2/${probe}"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" = "302" ]; then
              echo "build_${key}=false" >> "$GITHUB_OUTPUT"
              echo "already on wheels-v2: $probe - nothing to do"
            else
              echo "build_${key}=true" >> "$GITHUB_OUTPUT"
              echo "missing on wheels-v2 (HTTP $code): $probe - building"
            fi
          done

  build-cuda:
    name: Build CUDA wheel (Python ${{ matrix.python-version }})
    needs: preflight
    if: needs.preflight.outputs.build_cuda == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout hyprwhspr
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Derive installer contract (from backend_installer.py)
        run: |
          ver=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b.PYWHISPERCPP_VERSION)")
          pin=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b.PYWHISPERCPP_PINNED_COMMIT)")
          variant=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b._get_wheel_variant('${CUDA_BUILD_VERSION}'))")
          echo "EXPECTED_VERSION=$ver" >> "$GITHUB_ENV"
          echo "WHEEL_BUILD=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b.PYWHISPERCPP_WHEEL_BUILD)")" >> "$GITHUB_ENV"
          echo "VARIANT=$variant" >> "$GITHUB_ENV"
          commit='${{ github.event.inputs.pywhispercpp_commit }}'
          [ -n "$commit" ] || commit="$pin"
          echo "PYWHISPERCPP_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "contract: version=$ver variant=$variant commit=$commit"
          if [ "$variant" != "cuda12" ]; then
            echo "::error::Installer maps CUDA ${CUDA_BUILD_VERSION} to '$variant', expected 'cuda12'."
            exit 1
          fi
          if [ "$commit" != "$pin" ]; then
            echo "::warning::Building $commit, installer pins $pin (v$ver)."
          fi

      - name: Install CUDA Toolkit ${{ env.CUDA_BUILD_VERSION }}
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: ${{ env.CUDA_BUILD_VERSION }}.0
          method: 'network'
          sub-packages: '["nvcc", "cudart-dev"]'

      - name: Install additional CUDA libraries
        run: |
          sudo apt-get update
          CUDA_VER_DASH="${CUDA_BUILD_VERSION//./-}"
          sudo apt-get install -y libcublas-dev-${CUDA_VER_DASH}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git patchelf
          pip install --upgrade pip wheel setuptools build

      - name: Clone pywhispercpp
        run: |
          git clone --recurse-submodules https://github.com/Absadiki/pywhispercpp.git pywhispercpp-src
          cd pywhispercpp-src
          git checkout ${{ env.PYWHISPERCPP_COMMIT }}
          git submodule update --init --recursive

      - name: Build wheel with CUDA support
        env:
          GGML_CUDA: 'ON'
          GGML_NATIVE: 'OFF'  # generic x86-64 CPU flags instead of the runner's
          GGML_OPENMP: 'OFF'  # ggml threadpool; no libgomp dependency
          CUDACXX: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/bin/nvcc
          NO_REPAIR: '1'  # CUDA driver libs come from the user's system
        run: |
          cd pywhispercpp-src
          pip wheel . --no-deps --wheel-dir ../dist

      - name: Point bundled libraries at each other ($ORIGIN)
        run: |
          python -m wheel unpack dist/pywhispercpp-*.whl -d "$RUNNER_TEMP/unpacked"
          find "$RUNNER_TEMP/unpacked" -name '*.so*' -type f -exec patchelf --set-rpath '$ORIGIN' {} \;
          rm dist/pywhispercpp-*.whl
          python -m wheel pack "$RUNNER_TEMP"/unpacked/pywhispercpp-* -d dist --build-number "$WHEEL_BUILD"

      - name: Assert built version matches installer
        run: |
          cd dist
          built="$(ls pywhispercpp-*.whl | head -n1)"
          version="$(echo "$built" | sed -E 's/^pywhispercpp-([^-]+)-.*/\1/')"
          if [ "$version" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Built $version != installer's ${EXPECTED_VERSION}."
            exit 1
          fi

      - name: Rename wheel with CUDA variant suffix
        run: |
          cd dist
          for f in *.whl; do mv "$f" "${f%.whl}+${VARIANT}.whl"; done
          ls -la

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-cuda12-py${{ matrix.python-version }}
          path: dist/*.whl

  build-vulkan:
    # Debian trixie ships glslc, the Vulkan headers and the SPIRV-Headers CMake
    # package; its glibc is backend_installer.VULKAN_WHEEL_MIN_GLIBC.
    name: Build Vulkan wheel (Python ${{ matrix.python-version }})
    needs: preflight
    if: needs.preflight.outputs.build_vulkan == 'true'
    runs-on: ubuntu-latest
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake git curl ca-certificates binutils \
            glslc libvulkan-dev spirv-headers patchelf

      - name: Checkout hyprwhspr
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }} (uv)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" venv --seed --python ${{ matrix.python-version }} "$RUNNER_TEMP/py"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"

      - name: Derive installer contract (from backend_installer.py)
        run: |
          ver=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b.PYWHISPERCPP_VERSION)")
          pin=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b.PYWHISPERCPP_PINNED_COMMIT)")
          variant=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b.VULKAN_WHEEL_VARIANT)")
          glibc=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print('.'.join(map(str, b.VULKAN_WHEEL_MIN_GLIBC)))")
          echo "EXPECTED_VERSION=$ver" >> "$GITHUB_ENV"
          echo "WHEEL_BUILD=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b.PYWHISPERCPP_WHEEL_BUILD)")" >> "$GITHUB_ENV"
          echo "VARIANT=$variant" >> "$GITHUB_ENV"
          echo "MIN_GLIBC=$glibc" >> "$GITHUB_ENV"
          commit='${{ github.event.inputs.pywhispercpp_commit }}'
          [ -n "$commit" ] || commit="$pin"
          echo "PYWHISPERCPP_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "contract: version=$ver variant=$variant glibc>=$glibc commit=$commit"
          if [ "$commit" != "$pin" ]; then
            echo "::warning::Building $commit, installer pins $pin (v$ver)."
          fi

      - name: Install Python build tools
        run: pip install --upgrade pip wheel setuptools build

      - name: Clone pywhispercpp
        run: |
          git clone --recurse-submodules https://github.com/Absadiki/pywhispercpp.git pywhispercpp-src
          cd pywhispercpp-src
          git checkout ${{ env.PYWHISPERCPP_COMMIT }}
          git submodule update --init --recursive

      - name: Build wheel with Vulkan support
        env:
          GGML_VULKAN: '1'
          GGML_NATIVE: 'OFF'  # generic x86-64 CPU flags instead of the runner's
          GGML_OPENMP: 'OFF'  # ggml threadpool; no libgomp dependency
        run: |
          cd pywhispercpp-src
          pip wheel . --no-deps --wheel-dir ../dist

      - name: Point bundled libraries at each other ($ORIGIN)
        run: |
          python -m wheel unpack dist/pywhispercpp-*.whl -d "$RUNNER_TEMP/unpacked"
          find "$RUNNER_TEMP/unpacked" -name '*.so*' -type f -exec patchelf --set-rpath '$ORIGIN' {} \;
          rm dist/pywhispercpp-*.whl
          python -m wheel pack "$RUNNER_TEMP"/unpacked/pywhispercpp-* -d dist --build-number "$WHEEL_BUILD"

      - name: Assert built version matches installer
        run: |
          cd dist
          built="$(ls pywhispercpp-*.whl | head -n1)"
          version="$(echo "$built" | sed -E 's/^pywhispercpp-([^-]+)-.*/\1/')"
          if [ "$version" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Built $version != installer's ${EXPECTED_VERSION}."
            exit 1
          fi

      - name: Assert glibc requirement matches installer
        run: |
          mkdir -p "$RUNNER_TEMP/whl"
          python -m zipfile -e dist/pywhispercpp-*.whl "$RUNNER_TEMP/whl"
          needed=$(find "$RUNNER_TEMP/whl" -name '*.so*' -type f -exec objdump -T {} + \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -n1)
          echo "wheel needs glibc $needed; installer requires $MIN_GLIBC"
          if [ "$(printf '%s\n%s\n' "$needed" "$MIN_GLIBC" | sort -V | tail -n1)" != "$MIN_GLIBC" ]; then
            echo "::error::Wheel needs glibc $needed, above VULKAN_WHEEL_MIN_GLIBC $MIN_GLIBC."
            exit 1
          fi

      - name: Rename wheel with Vulkan variant suffix
        run: |
          cd dist
          for f in *.whl; do mv "$f" "${f%.whl}+${VARIANT}.whl"; done
          ls -la

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-vulkan-py${{ matrix.python-version }}
          path: dist/*.whl

  verify-vulkan:
    # Installs the wheel the installer will request on the oldest supported
    # glibc and transcribes a sample on Mesa's software Vulkan device (lavapipe).
    name: Verify Vulkan wheel (Python ${{ matrix.python-version }})
    needs: [build-vulkan]
    runs-on: ubuntu-latest
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Install Vulkan runtime (Mesa lavapipe)
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates libvulkan1 mesa-vulkan-drivers

      - name: Checkout hyprwhspr
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }} (uv)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" venv --seed --python ${{ matrix.python-version }} "$RUNNER_TEMP/py"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"

      - name: Derive expected filename from installer
        run: |
          py='${{ matrix.python-version }}'
          variant=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b.VULKAN_WHEEL_VARIANT)")
          dl=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b._get_wheel_filename('${py}', '${variant}', True))")
          pip=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b._get_wheel_filename('${py}', '${variant}', False))")
          echo "EXPECTED_WHEEL=$dl" >> "$GITHUB_ENV"
          echo "WHEEL_PIP_NAME=$pip" >> "$GITHUB_ENV"
          echo "installer wants: $dl"

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: wheel-vulkan-py${{ matrix.python-version }}
          path: dist

      - name: Assert build produced the requested file
        run: |
          if [ ! -f "dist/${EXPECTED_WHEEL}" ]; then
            echo "::error::Installer wants ${EXPECTED_WHEEL}; build did not produce it."
            ls -la dist
            exit 1
          fi

      - name: Install wheel with its dependencies
        run: |
          cp "dist/${EXPECTED_WHEEL}" "dist/${WHEEL_PIP_NAME}"
          pip install "dist/${WHEEL_PIP_NAME}"

      - name: Transcribe a sample through the Vulkan backend
        env:
          GGML_VK_VISIBLE_DEVICES: '0'
        run: |
          curl -fsSL -o jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.8.5/samples/jfk.wav
          python .github/scripts/verify_vulkan_wheel.py jfk.wav "ask not what your country can do for you"

  verify-wheels:
    # Derive the filename the installer will request and assert the build made it.
    name: Verify CUDA wheel (Python ${{ matrix.python-version }})
    needs: [build-cuda]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout hyprwhspr
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Derive expected filename from installer
        run: |
          py='${{ matrix.python-version }}'
          variant=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b._get_wheel_variant('${CUDA_BUILD_VERSION}'))")
          dl=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b._get_wheel_filename('${py}', '${variant}', True))")
          pip=$(PYTHONPATH=lib/src python -c "import backend_installer as b; print(b._get_wheel_filename('${py}', '${variant}', False))")
          echo "EXPECTED_WHEEL=$dl" >> "$GITHUB_ENV"
          echo "WHEEL_PIP_NAME=$pip" >> "$GITHUB_ENV"
          echo "installer wants: $dl"

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: wheel-cuda12-py${{ matrix.python-version }}
          path: dist

      - name: Assert build produced the requested file
        run: |
          if [ ! -f "dist/${EXPECTED_WHEEL}" ]; then
            echo "::error::Installer wants ${EXPECTED_WHEEL}; build did not produce it."
            ls -la dist
            exit 1
          fi

      - name: Confirm wheel installs on this Python
        run: |
          cp "dist/${EXPECTED_WHEEL}" "dist/${WHEEL_PIP_NAME}"
          # --no-deps: validate cp tag only; import needs a GPU absent on CI.
          pip install --no-deps "dist/${WHEEL_PIP_NAME}"

      - name: Smoke-check native lib linkage
        run: |
          site=$(python -c "import sysconfig; print(sysconfig.get_paths()['platlib'])")
          sos=$(find "$site" -maxdepth 2 \( -name '*.so' -o -name '*.so.*' \) | grep -iE 'pywhispercpp|whisper|ggml' || true)
          [ -n "$sos" ] || { echo "::error::no pywhispercpp native libs found in $site"; exit 1; }
          # The wheel's own libs (libggml*, libwhisper) resolve through their $ORIGIN
          # runpath; only genuinely-absent CUDA libs (no GPU on CI) should remain.
          missing=$(ldd $sos 2>/dev/null | grep 'not found' | grep -viE 'libcu|libnv' | sort -u || true)
          if [ -n "$missing" ]; then
            echo "::error::Non-CUDA shared libs unresolved (wheel likely unusable):"
            echo "$missing"
            exit 1
          fi
          echo "OK: only CUDA libs unresolved (expected without a GPU)"

  publish-wheels:
    name: Publish wheels to wheels-v2
    needs: [preflight, build-cuda, verify-wheels, build-vulkan, verify-vulkan]
    # Runs when at least one variant was built and nothing failed; a skipped
    # variant (already published) does not block the other.
    if: >-
      always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (needs.preflight.outputs.build_cuda == 'true' || needs.preflight.outputs.build_vulkan == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: true

      - name: Upload to rolling wheels-v2 release (merged checksums)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la wheels/
          (cd wheels && sha256sum *.whl) > new-sums.txt
          # Merge with the release's existing checksums: replace entries for
          # files being (re)uploaded, keep every other version's entries.
          gh release download wheels-v2 --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS.txt --output existing-sums.txt || : > existing-sums.txt
          awk '{print $2}' new-sums.txt > new-files.txt
          grep -vFf new-files.txt existing-sums.txt > SHA256SUMS.txt || true
          cat new-sums.txt >> SHA256SUMS.txt
          sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Fails if a wheel of this version and build is already published.
          gh release upload wheels-v2 wheels/*.whl --repo "$GITHUB_REPOSITORY"
          gh release upload wheels-v2 SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          cp SHA256SUMS.txt wheels/

      - name: Upload wheels as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: all-wheels
          path: wheels/
