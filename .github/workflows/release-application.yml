name: Application release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: application-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  payload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/build-release.py "$GITHUB_REF_NAME" /tmp/release
      - uses: actions/upload-artifact@v7
        with:
          name: application-release
          path: /tmp/release/*
  smoke:
    needs: payload
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: ['ubuntu:24.04', 'debian:bookworm', 'fedora:latest', 'opensuse/tumbleweed:latest']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: application-release
          path: /tmp/release
      - name: Disposable container prerequisites and CLI smoke check
        shell: bash
        run: |
          if command -v apt-get; then
            apt-get update
            apt-get install -y python3 python3-venv python3-dev gcc libevdev-dev libpulse0
          elif command -v dnf; then
            dnf install -y python3 python3-pip python3-devel gcc libevdev-devel pulseaudio-libs
          else
            zypper --non-interactive install python3 python3-pip python3-devel gcc libevdev-devel libpulse0
          fi
          cd /tmp/release
          sha256sum --check SHA256SUMS
          mkdir /tmp/payload
          tar -xzf hyprwhspr-*.tar.gz -C /tmp/payload
          python3 -m venv --system-site-packages /tmp/cli
          /tmp/cli/bin/python -m pip install --ignore-installed -r /tmp/payload/requirements-cli.txt
          PYTHONNOUSERSITE=1 /tmp/cli/bin/python -c 'import rich, requests, jsonschema, evdev, pulsectl, pyudev'
          PYTHONNOUSERSITE=1 /tmp/cli/bin/python /tmp/payload/lib/cli.py --version
          PYTHONNOUSERSITE=1 /tmp/cli/bin/python /tmp/payload/lib/cli.py install status
  prepare-draft:
    needs: [payload, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: application-release
          path: release
      - name: Prepare draft application release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          # A successful list with no match means missing. API failures must
          # stop the job rather than being mistaken for a missing release.
          state=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq \
            '.[] | [.tag_name, (if .draft then "draft" else "published" end)] | @tsv' \
            | awk -v tag="$GITHUB_REF_NAME" '$1 == tag { print $2 }')
          case "$state" in
            "")
              gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --verify-tag --draft --generate-notes ./*
              ;;
            draft)
              # Preserve the maintainer's title and notes on reruns.
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./*
              ;;
            published)
              echo "Release $GITHUB_REF_NAME is already published; assets left unchanged." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *)
              echo "Unexpected release lookup result: $state" >&2
              exit 1
              ;;
          esac
          url=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          {
            echo "Draft release prepared: $url"
            echo "Review the attached assets, edit the release notes, then publish the draft manually."
            echo "Wait for this workflow to finish successfully before publishing."
          } >> "$GITHUB_STEP_SUMMARY"
